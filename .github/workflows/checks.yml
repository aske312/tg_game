name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --test tests/ui_game.test.cjs
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: shellcheck -x -S warning -e SC1090,SC1091 deploy/*.sh
