name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --test tests/ui_game.test.cjs tests/ui_builder.test.cjs
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: shellcheck -x -S warning -e SC1090,SC1091 deploy/*.sh
  browser:
    needs: test
    runs-on: ubuntu-24.04
    env:
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python tests/browser_check.py
      - run: python tests/browser_media_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check
          path: data/browser-check/
